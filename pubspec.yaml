name: tvk_grievance
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.3.0
  marquee: ^2.3.0
  font_awesome_flutter: ^10.10.0
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  share_plus: ^10.1.2
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.1
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_localization: ^0.3.3
  dio: ^5.11.0
  url_launcher: ^6.3.2
  app_shimmer: ^1.0.5
  video_player: ^2.10.0
  uuid: ^4.5.1
  path: ^1.9.1
  internet_connection_checker_plus: ^2.7.2
  google_mlkit_translation: ^0.13.0
  package_info_plus: ^9.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_otp_text_field: ^1.5.1+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#9b0000"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-MediumItalic.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
